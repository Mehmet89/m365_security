name: M365 Security Check

on:
  workflow_dispatch:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PowerShell ausführen
        shell: pwsh
        run: ./m365_security.ps1
        env:
          TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          AZURE_CERT_BASE64: ${{ secrets.AZURE_CERT_BASE64 }}
          AZURE_CERT_PASSWORD: ${{ secrets.AZURE_CERT_PASSWORD }}

      - name: Bericht als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ./security-report.json
